<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Animated portfolio README banner for Rodrigo Sandler</title>
  <desc>A playful portfolio-inspired hero with outlined text, window cards, a polaroid, shadows, and looping decorative motion.</desc>

  <style>
    .title {
      font: 800 76px Arial, Helvetica, sans-serif;
      paint-order: stroke fill;
      stroke: #000;
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    .small-title {
      font: 800 31px Arial, Helvetica, sans-serif;
      paint-order: stroke fill;
      stroke: #000;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .body {
      font: 700 24px Arial, Helvetica, sans-serif;
      fill: #111;
    }

    .mono {
      font: 700 22px "Courier New", monospace;
      fill: #111;
    }

    .caption {
      font: 700 28px "Courier New", monospace;
      fill: #111;
    }

    .cursor {
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
  </style>

  <rect width="1200" height="620" fill="#22F2FF"/>
  <path d="M0 446H1200V620H0V446Z" fill="#22FFA2"/>
  <path d="M0 530H1200V620H0V530Z" fill="#FFDD22"/>
  <rect x="16" y="16" width="1168" height="588" stroke="#000" stroke-width="8"/>

