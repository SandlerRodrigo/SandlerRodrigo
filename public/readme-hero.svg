<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Rodrigo Sandler</title>
  <desc>An animated GitHub profile banner with Rodrigo Sandler's name, a playful hello world window, and a portrait polaroid.</desc>

  <style>
    .name {
      font: 900 96px Arial, Helvetica, sans-serif;
      paint-order: stroke fill;
      stroke: #000;
      stroke-width: 7px;
      stroke-linejoin: round;
    }

    .shadow-name {
      font: 900 96px Arial, Helvetica, sans-serif;
      fill: #000;
    }

    .window-title {
      font: 800 23px Arial, Helvetica, sans-serif;
      fill: #111;
    }

    .code {
      font: 800 21px "Courier New", monospace;
      fill: #111;
    }
  </style>

  <rect width="1200" height="430" fill="#22F2FF"/>
  <path d="M0 285H1200V430H0V285Z" fill="#22FFA2"/>
  <path d="M0 350H1200V430H0V350Z" fill="#FFDD22"/>
  <rect x="18" y="18" width="1164" height="394" stroke="#000" stroke-width="8"/>

  <g opacity="0.17" stroke="#000" stroke-width="2">
    <path d="M88 72H1112"/>
    <path d="M88 136H1112"/>
    <path d="M88 200H1112"/>
    <path d="M88 264H1112"/>
    <path d="M88 328H1112"/>
    <path d="M170 36V394"/>
    <path d="M320 36V394"/>
    <path d="M470 36V394"/>
    <path d="M620 36V394"/>
    <path d="M770 36V394"/>
    <path d="M920 36V394"/>
    <path d="M1070 36V394"/>
  </g>

  <g transform="translate(92 72)">
    <text class="shadow-name" x="7" y="92">Rodrigo</text>
    <text class="name" x="0" y="85" fill="#C6B2EF">Rodrigo</text>
    <text class="shadow-name" x="7" y="194">Sandler</text>
    <text class="name" x="0" y="187" fill="#FFB6C1">Sandler</text>
  </g>

  <g transform="translate(98 298)">
    <rect x="11" y="11" width="510" height="104" rx="8" fill="#000"/>
    <rect x="0" y="0" width="510" height="104" rx="8" fill="#fff" stroke="#000" stroke-width="4"/>
    <path d="M0 0H510V38H0V0Z" fill="#FFDD22" stroke="#000" stroke-width="4"/>
    <circle cx="438" cy="19" r="8" fill="#F87171" stroke="#000" stroke-width="3"/>
    <circle cx="465" cy="19" r="8" fill="#FACC15" stroke="#000" stroke-width="3"/>
    <circle cx="492" cy="19" r="8" fill="#4ADE80" stroke="#000" stroke-width="3"/>
    <text class="window-title" x="21" y="27">hello.world.exe</text>
    <text class="code" x="26" y="70">&gt; console.log("Hello, world!")</text>
    <rect x="398" y="52" width="12" height="24" fill="#111">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

